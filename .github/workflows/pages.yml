name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR validation is independent of production deployment.
# New commits replace outdated PR builds, but never cancel a main deployment.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Smoke test generated site
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html atom.xml public/css/editorial.css; do
            if [[ ! -s "_site/$file" ]]; then
              echo "::error::Missing or empty generated file: $file"
              exit 1
            fi
          done

          if ! find _site -mindepth 2 -name index.html -type f -print -quit | grep -q .; then
            echo "::error::No generated content pages found"
            exit 1
          fi

          if ! grep -q '<feed ' _site/atom.xml; then
            echo "::error::Generated Atom feed is invalid or empty"
            exit 1
          fi

          echo "Generated homepage, content pages, CSS and Atom feed verified."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
